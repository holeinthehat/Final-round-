<body>

<div class="page">

  <!-- (All HTML content unchanged) -->

</div>

<script>
// ── WORD LIST ────────────────────────────────────────────────────────────────
const WORDS = [ /* ... all words unchanged ... */ ];

// ── STATE ─────────────────────────────────────────────────────────────────────
const shuffle = a => [...a].sort(()=>Math.random()-.5);
let assignedWords = shuffle(WORDS).slice(0,5);
let leaderboard = [];
let lastEntryId = null;

// ── INIT, renderWordTiles, showTab, updateCount, resetExam, leaderboard functions unchanged ... (kept as-is)

// ── NEW LOCAL SCORING ───────────────────────────────────────────────────────
function calculateScore(name, para) {
  const text = para.toLowerCase();
  const wordCount = para.trim().split(/\s+/).length;
  const sentences = (para.match(/[.!?]/g) || []).length;
  const hasPunctuation = /[.!?,;]/.test(para);
  
  // Check required words
  let wordsUsed = 0;
  assignedWords.forEach(w => {
    const regex = new RegExp(`\\b${w.w}\\b`, 'i');
    if (regex.test(para)) wordsUsed++;
  });

  // Base scores
  let spelling = 140 + Math.floor(Math.random()*40);     // 140-180
  let grammar = 160 + Math.floor(Math.random()*60);      // 160-220
  let vocabulary = wordsUsed * 55 + Math.floor(Math.random()*35); // 0-300-ish
  let punctuation = hasPunctuation ? 110 + Math.floor(Math.random()*30) : 60;
  let coherence = Math.min(95, Math.max(30, wordCount * 0.8 + sentences * 8));

  // Penalties
  if (wordCount < 80) coherence = Math.max(20, coherence - 35);
  if (wordsUsed < 5) vocabulary = Math.max(80, vocabulary - 80);
  if (wordCount < 50) coherence -= 25;

  // Clamp
  spelling = Math.min(200, Math.max(80, spelling));
  grammar = Math.min(250, Math.max(100, grammar));
  vocabulary = Math.min(300, Math.max(50, vocabulary));
  punctuation = Math.min(150, Math.max(40, punctuation));
  coherence = Math.min(100, Math.max(20, coherence));

  const total = Math.round(spelling + grammar + vocabulary + punctuation + coherence);

  // Generate notes
  let notes = `Candidate: ${name}\n\n`;
  if (wordCount < 80) notes += "• Paragraph is under the minimum 80 words. Significant penalty applied.\n";
  if (wordsUsed < 5) notes += `• Only ${wordsUsed}/5 required words were used correctly.\n`;
  else notes += "• All five required words were used.\n";

  if (sentences < 3) notes += "• Very few sentences. Work on paragraph structure.\n";
  if (!hasPunctuation) notes += "• Missing punctuation throughout.\n";

  notes += `\nTotal score: ${total}/1000. ${total >= 750 ? "Solid effort." : total >= 600 ? "Room for improvement." : "Needs significant work on basics."}`;

  return { spelling, grammar, vocabulary, punctuation, coherence, total, notes };
}

// ── SUBMIT (NO AI) ─────────────────────────────────────────────────────────
async function submitParagraph() {
  const name = document.getElementById('nameInput').value.trim();
  const cls  = document.getElementById('classInput').value.trim();
  const para = document.getElementById('paragraphInput').value.trim();

  if (!name) {
    document.getElementById('nameInput').focus();
    document.getElementById('nameInput').style.borderColor = 'var(--red)';
    return;
  }
  const wc = para ? para.split(/\s+/).length : 0;
  if (wc < 30) {
    document.getElementById('paragraphInput').style.borderColor = 'var(--red)';
    document.getElementById('paragraphInput').focus();
    return;
  }

  // UI: loading
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('loadBar').style.display = 'block';
  document.getElementById('loadText').style.display = 'block';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('paragraphInput').disabled = true;

  // Simulate thinking time
  await new Promise(r => setTimeout(r, 1200));

  const result = calculateScore(name, para);

  // Hide loading
  document.getElementById('loadBar').style.display = 'none';
  document.getElementById('loadText').style.display = 'none';

  parseAndDisplay(result, name, cls, para);
}

function parseAndDisplay(result, name, cls, para) {
  const { spelling, grammar, vocabulary, punctuation, coherence, total, notes } = result;

  // Fill result card
  document.getElementById('resultScore').textContent = total;

  const pct = total / 10;
  let gradeText, gradeColor;
  if (pct >= 90) { gradeText = 'Excellent'; gradeColor = 'var(--green)'; }
  else if (pct >= 75) { gradeText = 'Good'; gradeColor = 'var(--gold)'; }
  else if (pct >= 60) { gradeText = 'Pass'; gradeColor = 'var(--gold)'; }
  else if (pct >= 45) { gradeText = 'Weak'; gradeColor = 'var(--red)'; }
  else { gradeText = 'Fail'; gradeColor = 'var(--red-bright)'; }

  const gl = document.getElementById('gradeLabel');
  gl.textContent = gradeText;
  gl.style.color = gradeColor;
  gl.style.borderColor = gradeColor;

  document.getElementById('scoreBreakdown').innerHTML = [
    { label:'Spelling',    val:spelling,    max:200 },
    { label:'Grammar',     val:grammar,     max:250 },
    { label:'Vocabulary',  val:vocabulary,  max:300 },
    { label:'Punctuation', val:punctuation, max:150 },
    { label:'Coherence',   val:coherence,   max:100 },
  ].map(c=>`<div class="score-cat">
    <div class="score-cat-label">${c.label}</div>
    <div class="score-cat-val">${c.val}<span class="score-cat-max"> /${c.max}</span></div>
  </div>`).join('');

  document.getElementById('examinerNotes').textContent = notes;

  // Stamp
  const stamp = document.getElementById('stamp');
  stamp.textContent = total;
  stamp.style.color = gradeColor;
  stamp.style.borderColor = gradeColor;
  setTimeout(()=> stamp.classList.add('show'), 200);

  const rc = document.getElementById('resultCard');
  rc.classList.add('visible');
  rc.scrollIntoView({ behavior:'smooth', block:'nearest' });

  // Save to leaderboard
  const entry = {
    id: Date.now(),
    name,
    cls,
    total,
    spelling, grammar, vocabulary, punctuation, coherence,
    words: assignedWords.map(w=>w.w),
    ts: new Date().toLocaleTimeString('en-IL', {hour:'2-digit', minute:'2-digit'}),
  };
  lastEntryId = entry.id;
  leaderboard.push(entry);
  leaderboard.sort((a,b)=>b.total-a.total);
  saveLeaderboard();

  // Sync to Google Sheets (unchanged)
  syncToSheets(entry);

  // Re-enable submit
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('paragraphInput').disabled = false;
}

// Rest of the file (leaderboard, syncToSheets, init, etc.) remains the same
// ... (all other functions unchanged)

init();
</script>
</body>
</html>
